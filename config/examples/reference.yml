# yaml-language-server: $schema=../../config.schema.json
---
# Botflota configuration example.
# Reference for every field. A scope is the top-level namespace.
# Copy this to ~/.config/botflota/config.yml and customize.

$schema: "../../config.schema.json"

# Instance settings (global; only valid in the main file)
address: "127.0.0.1"              # REST API bind address
port: 3000                        # REST API port (0 disables the API)
# log_level and log_level_deps describe `fleet run`. A one-shot command such as
# `bot pair` logs at warn and takes --verbose for the configured level.
log_level: "info"                 # debug, info, warn, error
log_level_deps: "info"            # dependency logs; also accepts off
default_timeout: 300              # Default graph session timeout in seconds
data_dir: "~/.local/share/botflota"  # Database and credentials (XDG default when omitted)
device_name: "Botflota"           # Name in the phone's Linked devices; brand it for a host
rate_limit:                        # API budgets per fixed minute
  credential_per_minute: 600       # One budget per token; 0 = unlimited
  failed_per_minute: 60            # Attempts with no valid credential; 0 = unlimited
# true: a scope belongs to at most one active access token. Minting refuses
# a scope another active token already holds, and startup fails while an
# overlap is already stored. false (the default): any number of access
# tokens may share a scope. The owner token always covers every scope.
# Restart to apply.
exclusive_scopes: false


# Multi-file organization: every file uses the `scopes` shape, and
# several files may contribute to the same scope under the same rules as one.
# Global settings are only valid in the main file.
# Uncomment only with the companion files present: a lone config must not
# include missing paths.
# include:
#   - ./scopes/support.yml
#   - ./scopes/*.yml
#   - ./extra/

# A scope is an isolation namespace. References and
# sessions never cross scopes. "support" is just a name, like any other.
scopes:
  support:
    display_name: "Customer Support" # Optional UI label; defaults to `support`
    # LLM profiles (optional). A bot without `llm` runs deterministically.
    llms:
      primary:
        display_name: "Primary model" # Optional UI label; key stays `primary`
        provider: "openai"        # openai, anthropic, ollama, ...
        model: "gpt-4o-mini"
        api_key: "${OPENAI_API_KEY}"  # Read the key from the environment
        routing: "fallback"       # off | fallback | always
        realization: "auto"       # off | auto
        bounds:                   # Tool call limits
          max_tools_per_message: 3
          timeout: 30000          # Tool call timeout in milliseconds

      # Local / self-hosted profile: same shape, with base_url
      local:
        provider: "ollama"
        model: "llama3.1"
        base_url: "http://localhost:11434"
        routing: "off"
        realization: "auto"
    actions:
      # Deterministic reply
      greet:
        display_name: "Greeting"
        steps:
          - message:
              body: "Hello! Welcome to our support chat. How can I help?"

      # Deterministic reply with variants, chosen at random
      farewell:
        steps:
          - message:
              body:
                - "Thank you! Have a great day."
                - "Thanks for stopping by. See you soon!"
                - "All done here. Take care!"

      # Intent-only reply: no fallback text; fails when no provider is configured
      summarize-policy:
        steps:
          - message:
              intent: "explain the return policy"
              policy: "Friendly and clear. Maximum three sentences. Never promise refunds."

      # The LLM generates from the intent, anchored on body; body is the
      # fallback
      confirm-order:
        steps:
          - message:
              body: "Your order is confirmed."
              intent: "confirm the order"
              policy: "Friendly, one short sentence, no extra promises."

      # Tool with a bound input: the LLM fills node.product once and it is
      # remembered for later tool calls in the same node
      product-info:
        inputs:
          product:
            type: "string"
            required: true
            description: "Product name or id to look up"
            bind: node.product
          fields:
            type: "string"
            required: false
            default: "name,price"
            description: "Comma-separated fields to return"
        steps:
          - request:
              name: lookup
              url: "https://api.example.com/products?q={{input.product}}"
              method: GET
              headers:
                Authorization: "Bearer ${API_TOKEN}"
              timeout: 5000
              retry: 1

      # Tool with side effects and several inputs
      start-order:
        inputs:
          product:
            type: "string"
            required: true
            description: "Product name or id to order"
            bind: node.product
          quantity:
            type: "integer"
            required: true
            description: "Units to order"
            bind: node.quantity
        steps:
          - request:
              name: create
              url: "https://api.example.com/orders"
              method: POST
              headers:
                Authorization: "Bearer ${API_TOKEN}"
              body: '{"product": "{{input.product}}", "qty": {{input.quantity}}}'
              timeout: 10000
              retry: 2

      # Used by the purchase node; body is the fallback when generation runs
      ask-product:
        steps:
          - message:
              body: "Which product would you like, and how many units?"
              intent: "ask which product they want"
              policy: "One short question; ask for product and quantity together."

      # Request with payload; response captured for later templates
      lead-notify:
        steps:
          - request:
              name: lead-capture
              url: "https://crm.example.com/leads"
              method: POST
              headers:
                X-API-Key: "your-crm-key"
              body: '{"phone": "{{sender.phone}}", "note": "{{message.body}}"}'
              timeout: 5000
              retry: 2
          - message:
              body: "Thanks! We created lead {{node.lead-capture.resp.body.id}}."

      # Send to a different recipient: `to` is a phone number or a template,
      # and empty means the sender. Here the operator is notified on WhatsApp
      # instead of the customer.
      notify-owner:
        steps:
          - message:
              to: "{{graph.owner_phone}}"
              body: "New request from {{sender.name}} ({{sender.phone}}): {{message.body}}"

      # Guarded action: a sender cannot trigger it twice within the cooldown,
      # nor more than 3 times per hour.
      escalate:
        guards:
          cooldown:
            duration: 120
            on_blocked:
              - message:
                  body: "You already requested a human. One will connect shortly."
          rate_limit:
            limit: 3
            window: 3600
            on_blocked:
              - message:
                  body: "Too many requests. Please try again later."
        steps:
          - message:
              body: "Connecting you to a human agent. One moment please."
          - request:
              name: escalate-human
              url: "https://api.example.com/support/escalate"
              method: POST
              headers:
                Authorization: "Bearer ${API_TOKEN}"
              body: '{"phone": "{{sender.phone}}"}'
              timeout: 10000
              retry: 3

      # on_exit hook used by the menu node
      nav-log:
        steps:
          - request:
              name: nav-event
              url: "https://analytics.example.com/navigation"
              method: POST
              headers:
                X-API-Key: "your-analytics-key"
              body: '{"bot": "{{bot.id}}", "event": "menu_exit"}'
              timeout: 3000
              retry: 1

      menu:
        steps:
          - message:
              body: "Main menu:\n1. Hours\n2. Catalog\n3. Talk to a human\n4. Pricing\n0. Exit"

      hours:
        steps:
          - message:
              body: "Support hours:\n- Monday-Friday: 9:00-18:00\n- Saturday: 10:00-14:00"

      catalog:
        steps:
          - message:
              body: "Here is our product catalog: https://example.com/catalog.pdf"

      pricing:
        steps:
          - message:
              body: "Our plans start at $29/month. Want details on a specific plan?"

      invalid:
        steps:
          - message:
              body: "That option is not valid. Please choose a number from the menu."

      # Location pin combined with a text message
      send-office:
        steps:
          - message:
              body: "Here is our office."
          - location:
              latitude: 19.4326
              longitude: -99.1332
              name: "Main Office"
              address: "Av. Reforma 123, CDMX"
              url: "https://example.com/office"
              description: "Second floor, ask for support."

      # Attachment from a URL; the channel downloads and uploads the bytes, so
      # the runtime context never holds the file
      send-photo:
        steps:
          - media:
              kind: "image"           # image, video, audio, document, sticker
              url: "https://example.com/promo.png"
              caption: "This week's offer"

      # Document from a local path, with the file name the recipient sees
      send-brochure:
        steps:
          - media:
              kind: "document"
              path: "/srv/botflota/brochure.pdf"
              name: "brochure.pdf"
              caption: "Our brochure"

      # Contact card
      share-contact:
        steps:
          - contact:
              name: "Support"
              phone: "5215500000000"

      # Poll; selectable is how many options a voter may pick (default 1)
      quick-poll:
        steps:
          - poll:
              question: "How was your experience?"
              options: ["Great", "Fine", "Poor"]
              selectable: 1

    graphs:
      faq-support:
        display_name: "Support FAQ"
        root: "menu"
        timeout: 300                  # Session TTL (seconds)
        fallback: "invalid"           # Target when no edge matches and LLM is off
        routing: "fallback"           # off | fallback | always (always = LLM decides first)
        initial_context:              # Persists across nodes for the session
          customer_name: ""
          visit_count: 0
          owner_phone: ""             # Recipient for notify-owner; set per bot

        nodes:
          menu:
            display_name: "Main menu"
            goal: "show the menu"
            policy: "Warm and brief. Never promise a human unless escalate runs."
            on_enter: ["menu"]
            on_exit: ["nav-log"]
            edges:
              - intent: "wants support hours"
                triggers: ["1", "hours", "schedule", "when are you open"]
                goto: "hours"
              - intent: "wants the catalog"
                triggers: ["2", "catalog", "products"]
                goto: "catalog"
              - intent: "wants to buy"
                triggers: ["buy", "order", "purchase"]
                goto: "purchase"
              - intent: "wants a human"
                goto: "escalate"
              - intent: "wants pricing"
                triggers: ["4", "price", "pricing", "cost"]
                goto: "pricing"
              - intent: "wants to leave"
                triggers: ["0", "exit", "bye", "goodbye"]
                goto: "farewell"
              - goto: "invalid"       # Default edge: catches everything else

          hours:
            goal: "show support hours"
            on_enter: ["hours"]
            edges:
              - intent: "wants the menu"
                triggers: ["menu", "back"]
                goto: "menu"
              - goto: "invalid"

          catalog:
            goal: "show the catalog"
            on_enter: ["catalog"]
            edges:
              - intent: "wants the menu"
                triggers: ["menu", "back"]
                goto: "menu"
              - goto: "invalid"

          purchase:
            goal: "help the customer buy"
            policy: "Confirm product and quantity before ordering. Never invent prices."
            initial_context:          # Node context; reset on re-entry
              product: ""
              quantity: 0
            on_enter: ["ask-product"]
            tools: ["product-info", "start-order"]
            edges:
              - intent: "wants the menu"
                triggers: ["menu", "back", "cancel"]
                goto: "menu"
              - intent: "wants a human"
                goto: "escalate"
              - goto: "invalid"

          pricing:
            goal: "answer pricing questions"
            on_enter: ["pricing"]
            initial_context:          # Node-local; resets on every re-entry
              plan: ""
              budget: 0
            edges:
              - intent: "wants the menu"
                triggers: ["menu", "back"]
                goto: "menu"
              - intent: "is ready to buy"
                goto: "lead"
              - goto: "invalid"

          lead:
            goal: "capture the lead"
            on_enter: ["lead-notify", "notify-owner"]
            edges:
              - intent: "wants the menu"
                triggers: ["menu", "back"]
                goto: "menu"
              - goto: "farewell"

          escalate:
            goal: "hand off to a human"
            on_enter: ["escalate"]    # Cooldown and rate limit guards apply here
            edges:
              - intent: "wants the menu"
                triggers: ["menu", "back"]
                goto: "menu"
              - goto: "invalid"

          invalid:
            goal: "recover from invalid input"
            on_enter: ["invalid"]
            edges:
              - goto: "menu"          # Always return to the menu after invalid input

          farewell:
            goal: "close the conversation"
            on_enter: ["farewell"]
            edges: []                 # Terminal node; session expires by timeout

      # Minimal single-node graph
      ping-pong:
        root: "ping"
        nodes:
          ping:
            goal: "respond to ping"
            on_enter: ["greet"]
            edges: []

    bots:
      support-bot:
        display_name: "Support assistant"
        graph: "faq-support"
        llm: "primary"              # Must exist in this scope
        settings:
          read_receipts: true         # Mark inbound as read before replying
          read_receipt_delay: 800     # Milliseconds before marking read
          reply_delay: 1200           # Milliseconds before sending the reply
          simulate_typing: true       # Show composing during reply_delay
          queue_delay: 1500           # Milliseconds between outbound messages
          jitter: 400                 # Extra random 0-400 ms per delay
          max_messages_per_minute: 0  # Outbound ceiling; 0 means no limit
          ignore_groups: true
          allowed_senders: []         # Empty means all senders allowed
          ignored_senders: ["5215500000000"]  # Plain phone numbers, no JID suffix
          history_sync: true          # Import the WhatsApp backlog when linking
          import_contacts: false      # Copy the account's address book too
          external_reply_pause: 900000  # Hand a chat over after a phone reply (ms)

      sales-bot:
        graph: "faq-support"        # No llm: this bot is deterministic
        settings:
          queue_delay: 1000
          ignore_groups: false

# Notes
# - This example exercises every field; field shapes are in
#   ../../config.schema.json.
# - Secrets never go in config: a ${ENV_VAR} reference is allowed only in
#   api_key and request header values.
