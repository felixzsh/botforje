scopes:
  default:
    actions:
      a:
        steps:
          - message:
              body: "hi"
          - request:
              name: r
              url: "https://example.com"
          - location:
              latitude: 1
              longitude: 2
          - media:
              kind: "image"
              url: "https://example.com/photo.png"
              caption: "A photo"
          - media:
              kind: "document"
              path: "/tmp/report.pdf"
              name: "report.pdf"
          - contact:
              name: "Support"
              entries:
                - kind: "phone"
                  value: "5215500000000"
                - kind: "email"
                  value: "support@example.com"
              note: "Mon-Fri 9-18"
          - poll:
              question: "How are we doing?"
              options: ["Great", "Fine"]
              selectable: 1
