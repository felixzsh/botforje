# Local development config. It has no secrets and no ${...} values, and its
# database lives at the repository root under .dev-data (gitignored). Run it
# with `make dev ARGS="status"`, which sets BOTFORJE_CONFIG to this file.
$schema: "../config.schema.json"
version: 1
data_dir: "../.dev-data"

scopes:
  dev:
    actions:
      greet:
        steps:
          - message:
              body: "dev bot: {{message.body}}"
    graphs:
      dev:
        root: "menu"
        nodes:
          menu:
            on_enter: ["greet"]
            edges: []
    bots:
      dev-bot:
        graph: "dev"
