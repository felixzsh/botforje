# Local development config: a deterministic support menu with no secrets and
# no ${...} values. Its database lives at the repository root under .dev-data
# (gitignored). Run it with `make dev ARGS="daemon"` (or validate it with
# `make dev ARGS="validate"`), then message the paired account.
$schema: "../config.schema.json"
version: 1
data_dir: "../.dev-data"
log_level: "debug"
log_level_deps: "info"

scopes:
  dev:
    actions:
      greet:
        steps:
          - message:
              body: |-
                Hi {{graph.customer_name}}, I'm the test bot.
                What do you need?
                1. Pricing
                2. Hours
                3. Catalog
                4. Location
                0. Exit
      prices:
        steps:
          - message:
              body: |-
                Plans:
                - Basic: $9/month
                - Pro: $29/month
                - Enterprise: custom
      hours:
        steps:
          - message:
              body: "We are open Monday to Friday, 9:00-18:00."
      catalog:
        steps:
          - message:
              body: "Catalog: https://example.com/catalog.pdf"
      office:
        steps:
          - message:
              body: "We are here:"
          - location:
              latitude: 19.4326
              longitude: -99.1332
              name: "BotForje Office (dev)"
              address: "123 Example St, CDMX"
              url: "https://example.com/office"
              description: "Second floor."
      agent:
        guards:
          cooldown:
            duration: 120
            on_blocked:
              - message:
                  body: "You already asked for a human; give me a moment."
        steps:
          - message:
              body: "Connecting you to a human. One moment please."
      farewell:
        steps:
          - message:
              body: "Thanks for writing, {{graph.customer_name}}! See you soon."
      invalid:
        steps:
          - message:
              body: 'I did not understand "{{message.body}}". Type 1-4, or 0 to exit.'
    graphs:
      support:
        root: "menu"
        fallback: "invalid"
        timeout: 300
        routing: "off"
        initial_context:
          customer_name: "Guest"
        nodes:
          menu:
            goal: "show the menu"
            on_enter: ["greet"]
            edges:
              - intent: "wants pricing"
                triggers: ["1", "pricing", "price", "plans", "how much"]
                goto: "prices"
              - intent: "wants opening hours"
                triggers: ["2", "hours", "opening", "schedule", "when are you open"]
                goto: "hours"
              - intent: "wants the catalog"
                triggers: ["3", "catalog", "catalogue", "products"]
                goto: "catalog"
              - intent: "wants the location"
                triggers: ["4", "location", "address", "office", "where are you"]
                goto: "office"
              - intent: "wants a human"
                triggers: ["human", "agent", "person", "support", "help"]
                goto: "agent"
              - intent: "wants to leave"
                triggers: ["0", "exit", "bye", "goodbye", "thanks"]
                goto: "farewell"
              - goto: "invalid"
          prices:
            goal: "answer pricing questions"
            on_enter: ["prices"]
            edges:
              - intent: "wants to buy"
                triggers: ["buy", "subscribe", "sign up", "i want pro"]
                goto: "agent"
              - intent: "wants the menu"
                triggers: ["menu", "back", "return"]
                goto: "menu"
              - goto: "invalid"
          hours:
            goal: "answer opening hours"
            on_enter: ["hours"]
            edges:
              - intent: "wants the menu"
                triggers: ["menu", "back", "return"]
                goto: "menu"
              - goto: "invalid"
          catalog:
            goal: "send the catalog"
            on_enter: ["catalog"]
            edges:
              - intent: "wants the menu"
                triggers: ["menu", "back", "return"]
                goto: "menu"
              - goto: "invalid"
          office:
            goal: "share the location"
            on_enter: ["office"]
            edges:
              - intent: "wants the menu"
                triggers: ["menu", "back", "return"]
                goto: "menu"
              - goto: "invalid"
          agent:
            goal: "hand off to a human"
            on_enter: ["agent"]
            edges:
              - intent: "wants the menu"
                triggers: ["menu", "back", "return"]
                goto: "menu"
              - goto: "invalid"
          invalid:
            goal: "recover from invalid input"
            on_enter: ["invalid"]
            edges:
              - goto: "menu"
          farewell:
            goal: "close the conversation"
            on_enter: ["farewell"]
            edges: []
    bots:
      dev-bot:
        graph: "support"
        settings:
          queue_delay: 300
          queue_jitter: 150
          simulate_typing: true
          typing_delay: 600
          read_receipts: true
          ignore_groups: true
