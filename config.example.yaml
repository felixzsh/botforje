# yaml-language-server: $schema=./config.schema.json
---
# BotForje Configuration Example (v1 draft)
# Reference for every v1 field. The intent model is settled (ADR 0003);
# exact matching and policy details are still open (Phase 1/4).
# Copy this to ~/.config/botforje/config.yml and customize.

$schema: "./config.schema.json"
version: 1

# Instance settings
address: "127.0.0.1"              # REST API bind address
port: 3000                        # REST API port (0 disables the API)
log_level: "info"                 # debug, info, warn, error
default_timeout: 300              # Default graph session timeout in seconds

# LLM integration (optional). Without this section bots run deterministically.
llm:
  provider: "openai"              # openai, anthropic, ollama, ...
  model: "gpt-4o-mini"
  api_key_env: "OPENAI_API_KEY"   # Env var name; never put keys in config
  # base_url: "http://localhost:11434"   # Local / self-hosted providers
  routing: "fallback"             # off | fallback | always
  realization: "auto"             # off | auto

# Action Catalog — reusable actions referenced by graphs.
# Scope is explicit; references never cross scopes. Default scope is "default".
actions:
  # Deterministic reply
  greet:
    scope: "support"
    steps:
      - message:
          body: "Hello! Welcome to our support chat. How can I help?"

  # Deterministic reply with variants, chosen at random
  farewell:
    scope: "support"
    steps:
      - message:
          body:
            - "Thank you! Have a great day."
            - "Thanks for stopping by. See you soon!"
            - "All done here. Take care!"

  # LLM-realized reply: the engine generates text from intent and policy
  summarize-policy:
    scope: "support"
    steps:
      - message:
          intent: explain_return_policy
          policy: "Friendly and clear. Maximum three sentences. Never promise refunds."

  # Deterministic base that the LLM may rewrite within policy (hybrid)
  confirm-order:
    scope: "support"
    steps:
      - message:
          body: "Your order is confirmed."
          intent: confirm_order
          policy: "Friendly, one short sentence, no extra promises."

  # Request with payload; response captured for later templates
  lead-notify:
    scope: "support"
    steps:
      - request:
          name: lead-capture
          url: "https://crm.example.com/leads"
          method: POST
          headers:
            X-API-Key: "your-crm-key"
          body: '{"phone": "{{sender.phone}}", "note": "{{message.body}}"}'
          timeout: 5000
          retry: 2
      - message:
          body: "Thanks! We created lead {{node.lead-capture.resp.body.id}}."

  # Guarded action: same sender cannot trigger it twice within the cooldown
  escalate:
    scope: "support"
    guards:
      cooldown:
        duration: 120
        on_blocked:
          - message:
              body: "You already requested a human. One will connect shortly."
    steps:
      - message:
          body: "Connecting you to a human agent. One moment please."
      - request:
          name: escalate-human
          url: "https://api.example.com/support/escalate"
          method: POST
          headers:
            Authorization: "Bearer your-api-token"
          body: '{"phone": "{{sender.phone}}"}'
          timeout: 10000
          retry: 3

  # on_exit hook used by the menu node
  nav-log:
    scope: "support"
    steps:
      - request:
          name: nav-event
          url: "https://analytics.example.com/navigation"
          method: POST
          headers:
            X-API-Key: "your-analytics-key"
          body: '{"bot": "{{bot.id}}", "event": "menu_exit"}'
          timeout: 3000
          retry: 1

  menu:
    scope: "support"
    steps:
      - message:
          body: "Main menu:\n1. Hours\n2. Catalog\n3. Talk to a human\n4. Pricing\n0. Exit"

  hours:
    scope: "support"
    steps:
      - message:
          body: "Support hours:\n- Monday-Friday: 9:00-18:00\n- Saturday: 10:00-14:00"

  catalog:
    scope: "support"
    steps:
      - message:
          body: "Here is our product catalog: https://example.com/catalog.pdf"

  pricing:
    scope: "support"
    steps:
      - message:
          body: "Our plans start at $29/month. Want details on a specific plan?"

  invalid:
    scope: "support"
    steps:
      - message:
          body: "That option is not valid. Please choose a number from the menu."

  # Location pin combined with a text message
  send-office:
    scope: "support"
    steps:
      - message:
          body: "Here is our office."
      - location:
          latitude: 19.4326
          longitude: -99.1332
          name: "Main Office"
          address: "Av. Reforma 123, CDMX"

# Multi-file organization: fragments may define any mix of actions, graphs,
# and bots. Global settings are only valid in config.yml.
# include:
#   - ./tenants/support.yml
#   - ./tenants/*.yml
#   - ./extras/

# Graph Catalog — conversation state machines
graphs:
  faq-support:
    scope: "support"
    root: "menu"
    timeout: 300                  # Session TTL (seconds)
    fallback: "invalid"           # Target when no edge matches and LLM is off
    initial_context:              # Persists across nodes for the session
      customer_name: ""
      visit_count: 0

    nodes:
      menu:
        intent: show_menu
        examples: ["menu", "start", "help", "options"]
        policy: "Warm and brief. Never promise a human unless escalate runs."
        on_enter: ["menu"]
        on_exit: ["nav-log"]
        can_use: ["lead-notify"]  # Optional actions; deterministic or LLM-selected
        edges:
          - examples: ["1", "hours", "schedule", "when are you open"]
            goto: "hours"
          - examples: ["2", "catalog", "products"]
            goto: "catalog"
          - intent: ask_human     # LLM routing when no example matches
            goto: "escalate"
          - examples: ["4", "price", "pricing", "cost"]
            goto: "pricing"
          - examples: ["0", "exit", "bye", "goodbye"]
            goto: "farewell"
          - goto: "invalid"       # Default edge: catches everything else

      hours:
        intent: show_hours
        examples: ["hours", "schedule", "open"]
        on_enter: ["hours"]
        edges:
          - examples: ["menu", "back"]
            goto: "menu"
          - goto: "invalid"

      catalog:
        intent: browse_catalog
        examples: ["catalog", "products", "brochure"]
        on_enter: ["catalog"]
        edges:
          - examples: ["menu", "back"]
            goto: "menu"
          - goto: "invalid"

      pricing:
        intent: ask_pricing
        examples: ["price", "pricing", "cost", "plans"]
        on_enter: ["pricing"]
        initial_context:          # Node-local; resets on every re-entry
          plan: ""
          budget: 0
        edges:
          - examples: ["menu", "back"]
            goto: "menu"
          - intent: ready_to_buy
            goto: "lead"
          - goto: "invalid"

      lead:
        intent: capture_lead
        on_enter: ["lead-notify"]
        edges:
          - examples: ["menu", "back"]
            goto: "menu"
          - goto: "farewell"

      escalate:
        intent: ask_human
        examples: ["human", "agent", "person", "talk", "speak"]
        on_enter: ["escalate"]    # Cooldown guard applies here
        edges:
          - examples: ["menu", "back"]
            goto: "menu"
          - goto: "invalid"

      invalid:
        intent: invalid_option
        on_enter: ["invalid"]
        edges:
          - goto: "menu"          # Always return to the menu after invalid input

      farewell:
        intent: farewell
        examples: ["bye", "goodbye", "thanks", "that is all"]
        on_enter: ["farewell"]
        edges: []                 # Terminal node; session expires by timeout

  # Minimal single-node graph
  ping-pong:
    scope: "support"
    root: "ping"
    nodes:
      ping:
        intent: health_check
        examples: ["ping"]
        on_enter: ["greet"]
        edges: []

bots:
  support-bot:
    scope: "support"
    graph: "faq-support"
    settings:
      queue_delay: 1500           # Milliseconds between outbound messages
      ignore_groups: true
      allowed_senders: []         # Empty means all senders allowed
      ignored_senders: ["status@broadcast"]

  sales-bot:
    scope: "support"
    graph: "faq-support"
    settings:
      queue_delay: 1000
      ignore_groups: false

# Notes
# - Hybrid model (ADR 0003): a node declares what it is doing (intent,
#   examples, policy) and how it transitions (edges).
# - Message modes:
#     body only              deterministic text (string or list of variants)
#     intent only            LLM realization from intent and policy
#     body + intent          LLM rewrite of the deterministic base
# - Matching runs deterministically first (examples). LLM routing handles
#   the rest when the llm section is configured. No llm section means a
#   fully deterministic bot.
# - Scope is an explicit field; uniqueness key is (type, scope, name).
# - Template contexts: {{graph.*}}, {{node.*}}, {{sender.*}}, {{message.*}},
#   {{bot.*}}, and request results as {{node.<request-name>.resp.body.*}}.
# - Matching thresholds and structured policy details stay open until the
#   algorithms and the engine exist (Phase 1/4).
